<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 10px;
            box-sizing: border-box;
        }

        .main-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .big-button {
            font-size: 24px;
            border-width: 5px;
            border-radius: 10px;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bolder;
            color: white !important;
        }

        #red-button { background-color: rgb(120, 0, 0) !important; }
        #blue-button { background-color: rgb(0, 0, 100) !important; }

        .keypad {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            width: 100%;
            aspect-ratio: 3/4;
            min-width: 0;
            min-height: 0;
            padding: 5px;
            border: 5px solid #a1a1a1;
            background-color: rgb(50, 48, 43);
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        /* Remove any flex settings that might be interfering */
        .keypad {
            align-items: initial;
            justify-content: initial;
            flex-direction: initial;
            flex-wrap: initial;
        }

        .keypad-button-num, 
        .keypad-button-red, 
        .keypad-button-blue {
            width: 100%;
            height: 100%;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0;
            margin: 0;
        }

        .control-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin: 10px 0;
        }

        .button-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .control-button {
            flex: 1;
            max-width: 200px;  /* Prevent buttons from getting too wide */
            min-width: 120px;  /* Ensure buttons don't get too narrow */
            height: 80px;
            padding: 10px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            font-family: Arial, Helvetica, sans-serif;
        }

        .indicator-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding-bottom: 10px;
        }

        .indicator-rows {
            width: 100%;
            max-width: 600px;
        }

        .indicator-row {
            display: flex;
            gap: 5px;
            margin: 10px 0;
            width: 100%;
            justify-content: center;
        }

        .indicator-square {
            flex: 1;
            aspect-ratio: 1; /* Keep squares square */
            min-width: 20px; /* Minimum size */
            max-width: 40px; /* Maximum size */
            height: auto; /* Height will match width due to aspect-ratio */
            border: 2px solid #a1a1a1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(40, 37, 32);
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .highlighted {
            background-color: #fff176;
        }

        body {
            background-color: black;
            color: white;
        }

        .control-button.inverter-active {
            background-color: rgb(190, 0, 0);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .control-button.phone-active {
            background-color: rgb(0, 160, 0);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .big-button, .keypad-button-num, .keypad-button-red, .keypad-button-blue, .control-button {
            background-color: rgb(236, 213, 163);
            color: rgb(17, 14, 7);
            border: 5px solid #a1a1a1;
            font-weight: bolder;
            border-radius: 10px;
            box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.2), 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .description-box {
            padding: 10px 20px;
            font-size: 11px;
            height: 75px;
            min-width: 100px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(40, 37, 32);
            border: 5px solid #a1a1a1;
            text-align: center;
            font-family: sans-serif;
            font-weight: bold;
            color: rgb(223, 193, 63);
        }

        #clear-button {
            width: 120px;
            height: 80px;
            font-size: 18px;
            background-color: rgb(104, 95, 76);
            color: white;
            border: 5px solid #a1a1a1;
            font-weight: bolder;
            border-radius: 10px;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.2), 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        #clear-button:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .big-button:active, .keypad-button-num:active, .keypad-button-red:active, 
        .keypad-button-blue:active, .control-button:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @media (min-width: 768px) {
            .container { gap: 20px; padding: 20px; }
            .main-buttons { gap: 20px; }
            .big-button { 
                width: 120px;
                height: 215px;
                font-size: 36px;
            }
            .keypad-button-num, .keypad-button-red, .keypad-button-blue {
                font-size: 20px;
            }
            .control-buttons {
                gap: 20px;
                margin-top: 300px;    /* Even more space on larger screens */
                margin-bottom: 100px; /* Equal space on bottom */
            }

            .button-row {
                gap: 20px;
                padding: 0 20px;
            }

            .indicator-square {
                min-width: 30px;
            }

            #clear-button {
                width: 120px;
                height: 80px;
            }

            .control-button {
                height: 80px;
                font-size: 24px;
            }

            .description-box {
                font-size: 12px;
                height: 70px;
                margin: 0 20px;  /* Match larger button row padding */
            }
        }

        .clear-button-container {
            margin-top: 10px;
        }

        @media (min-width: 768px) {
            .clear-button-container {
                margin-top: 20px;
            }
        }

        .top-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: auto auto;
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Ensure all grid items fill their space */
        .top-grid > * {
            min-width: 0;
            min-height: 0;
            width: 100%;
            height: 100%;
        }

        /* Adjust button stack to properly fill space */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .button-stack .big-button {
            flex: 1;
            min-height: 0;
        }

        .button-stack .description-box {
            flex: 0 0 auto;
        }

        /* Ensure the keypad container doesn't grow larger than its grid cell */
        .keypad {
            width: 100%;
            aspect-ratio: 3/4;
            min-width: 0;
            min-height: 0;
        }

        /* Make the blue button match the keypad's actual height */
        .big-button {
            width: 100% !important;
            height: 100% !important;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ensure content stays within viewport on very small screens */
        @media (max-height: 500px) {
            .container {
                gap: 10px;
            }

            .top-grid {
                max-height: 35vh;
            }

            .control-buttons {
                margin: 5px 0;
            }

            .indicator-section {
                gap: 5px;
            }
        }

        .bottom-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .keypad-button-red {
            background-color: rgb(120, 0, 0) !important;
            color: white !important;
            font-size: 20px;
        }

        .keypad-button-blue {
            background-color: rgb(0, 0, 100) !important;
            color: white !important;
            font-size: 20px;
        }

        .big-button.inverter-active {
            background-color: rgb(190, 0, 0) !important;
            color: white !important;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .big-button.phone-active {
            background-color: rgb(0, 160, 0) !important;
            color: white !important;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Update the zeroize button color */
        .bottom-buttons .big-button {
            color: rgb(17, 14, 7) !important;
        }

        /* Normal state - black text */
        .button-stack .big-button,
        .bottom-buttons .big-button {
            color: rgb(17, 14, 7) !important;
        }

        /* Active states - white text */
        .big-button.inverter-active,
        .big-button.phone-active {
            color: white !important;
        }

        /* Make other elements match the keypad's height */
        .big-button,
        .button-stack {
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-grid">
            <button class="big-button" style="background-color: rgb(120, 0, 0);">LIVE</button>
            <div class="keypad">
                <button class="keypad-button-num">7</button>
                <button class="keypad-button-num">8</button>
                <button class="keypad-button-num">9</button>
                <button class="keypad-button-num">4</button>
                <button class="keypad-button-num">5</button>
                <button class="keypad-button-num">6</button>
                <button class="keypad-button-num">1</button>
                <button class="keypad-button-num">2</button>
                <button class="keypad-button-num">3</button>
                <button class="keypad-button-red">L</button>
                <button class="keypad-button-num">0</button>
                <button class="keypad-button-blue">B</button>
            </div>
            <div class="button-stack">
                <div class="description-box">CONFIGURE ON KEYPAD<br>―――――――――――――<br>NON-PLAYER USE ONLY</div>
                <button class="big-button">INVERTER</button>
                <button class="big-button">PHONE</button>
            </div>
            <button class="big-button" style="background-color: rgb(0, 0, 100);">BLANK</button>
        </div>

        <div class="indicator-section">
            <div class="indicator-rows">
                <div class="indicator-row" id="total-tokens">
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                </div>
                <div class="indicator-row" id="played-tokens">
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                    <div class="indicator-square"></div>
                </div>
            </div>
            <div class="bottom-buttons">
                <button class="big-button" style="grid-column: span 3;">ZEROIZE MEMORY</button>
            </div>
        </div>
    </div>

    <script>
        // State management
        let gameState = {
            phoneMode: false,
            inverterMode: false,
            lastNumber: 0
        };

        // Initialize all button references
        const redButton = document.querySelector('.big-button[style*="rgb(120, 0, 0)"]');
        const blueButton = document.querySelector('.big-button[style*="rgb(0, 0, 100)"]');
        const inverterButton = document.querySelector('.button-stack .big-button:nth-child(2)');
        const phoneButton = document.querySelector('.button-stack .big-button:nth-child(3)');
        const clearButton = document.querySelector('.bottom-buttons .big-button');
        const numButtons = document.querySelectorAll('.keypad-button-num');
        const redKeyButton = document.querySelector('.keypad-button-red');
        const blueKeyButton = document.querySelector('.keypad-button-blue');
        const totalTokens = document.getElementById('total-tokens').children;
        const playedTokens = document.getElementById('played-tokens').children;

        // Add this at the start of your script section
        const CONFIG = {
            colors: {
                red: 'rgb(120, 0, 0)',
                blue: 'rgb(0, 0, 100)',
                brightRed: 'rgb(230, 0, 0)',
                brightBlue: 'rgb(30, 135, 230)',
                white: 'white',
                inactive: ''
            },
            tokens: {
                red: 'L',
                blue: 'B',
                phone: 'P',
                played: 'X'
            },
            ui: {
                inverter: {
                    active: 'INVERTING',
                    inactive: 'INVERTER'
                },
                phone: {
                    active: 'IN CALL',
                    inactive: 'PHONE'
                },
                buttons: {
                    clear: 'ZEROIZE MEMORY',
                    red: 'LIVE',
                    blue: 'BLANK'
                }
            }
        };

        // Helper functions
        function processKeypadInput(number, color) {
            if (gameState.phoneMode) {
                const emptyIndex = findNthEmptyBox(parseInt(number));
                if (emptyIndex !== -1) {
                    const box = playedTokens[emptyIndex];
                    box.style.backgroundColor = color === CONFIG.tokens.red ? CONFIG.colors.brightRed : CONFIG.colors.brightBlue;
                    box.style.color = CONFIG.colors.white;
                    
                    // Reset phone mode after use
                    clearPhoneButton();
                }
            } else {
                const count = parseInt(number);  // Ensure number is parsed as integer
                const isRed = color === CONFIG.tokens.red;
                
                // Remove bounds checking for total tokens
                if (isRed) {
                    // Red fills from left
                    for (let i = 0; i < count; i++) {
                        totalTokens[i].style.backgroundColor = CONFIG.colors.brightRed;
                    }
                } else {
                    // Blue fills from right
                    for (let i = 0; i < count; i++) {
                        totalTokens[totalTokens.length - 1 - i].style.backgroundColor = CONFIG.colors.brightBlue;
                    }
                }
            }
        }

        function findNthEmptyBox(n) {
            let emptyCount = 0;
            for (let i = 0; i < playedTokens.length; i++) {
                if (!playedTokens[i].innerHTML) {
                    emptyCount++;
                    if (emptyCount === n) return i;
                }
            }
            return -1;
        }

        function colorInitialTokens(count, color) {
            const bgColor = color === CONFIG.tokens.red ? CONFIG.colors.brightRed : CONFIG.colors.brightBlue;
            const startIndex = color === CONFIG.tokens.red ? 0 : totalTokens.length - count;
            for (let i = 0; i < count; i++) {
                totalTokens[startIndex + i].style.backgroundColor = bgColor;
            }
        }

        function markToken(isRed) {
            const isRedActive = gameState.inverterMode ? !isRed : isRed;
            const color = isRedActive ? CONFIG.colors.brightRed : CONFIG.colors.brightBlue;
            
            // Add to first empty or phone-colored box in played tokens (bottom row)
            for (let box of playedTokens) {
                // Allow marking if box has no content or just has a color (phone mark)
                if (!box.innerHTML) {
                    box.style.backgroundColor = color;
                    box.innerHTML = CONFIG.tokens.played;
                    box.style.color = CONFIG.colors.white;
                    break;
                }
            }

            // Still try to mark a token in the top row if available
            const tokens = Array.from(totalTokens);
            const direction = isRedActive ? {
                start: 0,
                step: 1
            } : {
                start: tokens.length - 1,
                step: -1
            };

            // Find and mark token with X (if available)
            for (let i = direction.start; i >= 0 && i < tokens.length; i += direction.step) {
                if (tokens[i].style.backgroundColor === color && !tokens[i].innerHTML) {
                    tokens[i].innerHTML = CONFIG.tokens.played;
                    tokens[i].style.color = CONFIG.colors.white;
                    break;
                }
            }

            if (gameState.inverterMode) {
                clearInverterButton();
            }
        }

        function clearIndicators() {
            [...totalTokens, ...playedTokens].forEach(box => {
                box.style.backgroundColor = '';
                box.innerHTML = '';
                box.classList.remove('next-position');
            });
        }

        function clearKeypad(){
            [...numButtons, redKeyButton, blueKeyButton].forEach(button => {
                button.style.backgroundColor = '';
            });
        }

        // Add these new helper functions
        function clearInverterButton() {
            gameState.inverterMode = false;
            inverterButton.classList.remove('inverter-active');
            inverterButton.innerHTML = CONFIG.ui.inverter.inactive;
            inverterButton.style.color = CONFIG.colors.inactive;
        }

        function clearPhoneButton() {
            gameState.phoneMode = false;
            phoneButton.classList.remove('phone-active');
            phoneButton.innerHTML = CONFIG.ui.phone.inactive;
            phoneButton.style.color = CONFIG.colors.inactive;
        }

        // Add new clear functions
        function clearAllButtons() {
            clearInverterButton();
            clearPhoneButton();
            clearKeypad();
        }

        // Event Listeners
        redButton.addEventListener('click', () => markToken(true));
        blueButton.addEventListener('click', () => markToken(false));
        clearButton.addEventListener('click', () => {
            clearIndicators();
            clearAllButtons();
            gameState.lastNumber = 0;
        });

        inverterButton.addEventListener('click', () => {
            if (gameState.inverterMode) {
                clearInverterButton();
            } else {
                gameState.inverterMode = true;
                inverterButton.classList.add('inverter-active');
                inverterButton.innerHTML = CONFIG.ui.inverter.active;
                inverterButton.style.color = CONFIG.colors.white;
            }
        });

        phoneButton.addEventListener('click', () => {
            if (gameState.phoneMode) {
                clearPhoneButton();
            } else {
                gameState.phoneMode = true;
                phoneButton.classList.add('phone-active');
                phoneButton.innerHTML = CONFIG.ui.phone.active;
                phoneButton.style.color = CONFIG.colors.white;
            }
        });

        // Keypad input handling
        [...numButtons, redKeyButton, blueKeyButton].forEach(button => {
            button.addEventListener('click', () => {
                const value = button.innerHTML;
                if (value === CONFIG.tokens.red || value === CONFIG.tokens.blue) {
                    clearKeypad();
                    processKeypadInput(gameState.lastNumber, value);
                } else {
                    clearKeypad();
                    gameState.lastNumber = parseInt(value);
                    button.style.backgroundColor = 'white';
                }                
            });
        });

        // Update the button text content
        redButton.innerHTML = CONFIG.ui.buttons.red;
        blueButton.innerHTML = CONFIG.ui.buttons.blue;
        clearButton.innerHTML = CONFIG.ui.buttons.clear;

    </script>
</body>
</html>
